min_version: 1.10.0
assert_lefthook_installed: true

output:
  - summary
  - success
  - failure
  - execution_out

# ── Pre-commit ────────────────────────────────────────────────────────
# Required auto-fix + early verify (fixing is enforced here, not opt-in):
# knip --fix → eslint --fix → prettier → deps → links → typecheck → typedoc →
# diagram. Fixers run first and re-stage; the checks are fail-fast; the diagram
# regenerates (and stages) only if everything passed. Piped: stops at first failure.
# A failure means the autofixer already ran and couldn't resolve it — the
# fail_text points at manual resolution, not at re-running the same fixer.

pre-commit:
  piped: true
  skip:
    - merge
    - rebase
  commands:
    knip:
      priority: 1
      glob: "**/*.{ts,tsx,json}"
      run: npx knip --fix
      stage_fixed: true
      fail_text: "Unused code remains that knip can't auto-remove."
    eslint:
      priority: 2
      glob: "**/*.{ts,tsx}"
      run: npx eslint --max-warnings 0 --fix {staged_files}
      stage_fixed: true
      fail_text: "ESLint auto-fixed what it could; the errors above have no autofix."
    prettier:
      priority: 3
      glob: "**/*.{ts,tsx,js,json,md,yml,yaml}"
      run: npx prettier --write {staged_files}
      stage_fixed: true
      fail_text: "Prettier could not parse a file — fix the syntax error shown above."
    deps:
      priority: 4
      glob: "src/**/*.{ts,tsx}"
      run: npm run deps:check
      fail_text: "Layer-boundary violation above (see .dependency-cruiser.cjs)."
    links:
      priority: 5
      glob: "**/*.{md,ts,tsx}"
      run: npm run docs:links
      fail_text: "A Markdown link or heading anchor above doesn't resolve."
    typecheck:
      priority: 6
      glob: "**/*.{ts,tsx}"
      run: npx tsc --noEmit
      fail_text: "Type errors above must be resolved before committing."
    typedoc:
      priority: 7
      glob: "**/*.{ts,tsx}"
      run: npm run docs:check
      fail_text: "typedoc validation failed above (missing/invalid JSDoc)."
    diagram:
      priority: 8
      glob: "src/**/*.{ts,tsx}"
      run: npm run deps:diagram:update && git add docs/architecture.mermaid docs/architecture.svg
      fail_text: "Architecture diagram regeneration failed (dependency-cruiser/mmdc)."


# ── Pre-push ──────────────────────────────────────────────────────────
# Pre-flight check mirroring the CI pipeline: runs `npm run ci`
# (audit → docs:fresh → test → build → api:fresh; build precedes api:fresh).

pre-push:
  piped: true
  commands:
    ci:
      priority: 1
      run: npm run ci
      timeout: "180s"
      fail_text: "Quality checks failed. Run `npm run ci` to see errors."

# ── Commit-msg ────────────────────────────────────────────────────────
# Enforce conventional commits with required scope and body.

commit-msg:
  commands:
    commitlint:
      run: npx --no -- commitlint --edit {1}
      fail_text: |
        Commit message does not follow Conventional Commits.
        Format:
          type(scope): subject
                                    <- blank line required
          body (required — explain WHY, not just what)

        Valid types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert
        Scope is required (e.g., auth, api, mcp). Use kebab-case for multi-word scopes.

        Use two -m flags to guarantee the blank line on the command line:
          git commit -m "type(scope): subject" -m "Explain why, not just what."
