min_version: 1.10.0
assert_lefthook_installed: true

output:
  - summary
  - success
  - failure
  - execution_out

# ── Pre-commit ────────────────────────────────────────────────────────
# Fast fix/check for cleanliness — format + lint staged files only.
# Doc generation happens at build time, validated at push time.

pre-commit:
  piped: true
  skip:
    - merge
    - rebase
  commands:
    prettier:
      priority: 1
      glob: "**/*.{ts,tsx,js,json,md,yml,yaml}"
      run: npx prettier --write {staged_files}
      stage_fixed: true
      fail_text: "Prettier formatting failed. Run `npm run prettier:fix` to fix."
    eslint:
      priority: 2
      glob: "**/*.{ts,tsx}"
      run: npx eslint --max-warnings 0 --fix {staged_files}
      stage_fixed: true
      fail_text: "ESLint check failed. Run `npm run lint:fix` to fix."

# ── Pre-push ──────────────────────────────────────────────────────────
# Pre-flight check mirroring the CI pipeline.
# Piped: compile first (dist/ needed for api:check), then validate.

pre-push:
  piped: true
  commands:
    ci:
      priority: 1
      run: npm run ci
      timeout: "180s"
      fail_text: "Quality checks failed. Run `npm run ci` to see errors."

# ── Commit-msg ────────────────────────────────────────────────────────
# Enforce conventional commits with required scope and body.

commit-msg:
  commands:
    commitlint:
      run: npx --no -- commitlint --edit {1}
      fail_text: |
        Commit message does not follow Conventional Commits.
        Format:
          type(scope): subject
                                    <- blank line required
          body (required — explain WHY, not just what)

        Valid types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert
        Scope is required (e.g., auth, api, mcp). Use kebab-case for multi-word scopes.

        Use two -m flags to guarantee the blank line on the command line:
          git commit -m "type(scope): subject" -m "Explain why, not just what."
