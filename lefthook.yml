min_version: 1.10.0
assert_lefthook_installed: true

output:
  - summary
  - success
  - failure
  - execution_out

pre-commit:
  piped: true
  skip:
    - merge
    - rebase
  commands:
    prettier:
      priority: 1
      glob: "**/*.{ts,tsx,js,json,md,yml,yaml}"
      run: npx prettier --write {staged_files}
      stage_fixed: true
      fail_text: "Prettier formatting failed. Run `npm run prettier:write` to fix."
    eslint:
      priority: 2
      glob: "**/*.{ts,tsx}"
      run: npx eslint --max-warnings 0 --fix {staged_files}
      stage_fixed: true
      fail_text: "ESLint check failed. Run `npm run lint:fix` to fix."

pre-push:
  commands:
    test:
      run: npm run test
      timeout: 300
      fail_text: "Quality checks failed. Run `npm run test` to see errors."

commit-msg:
  commands:
    commitlint:
      run: npx --no -- commitlint --edit {1}
      fail_text: |
        Commit message does not follow Conventional Commits.
        Format:
          type(scope): subject
                                    <- blank line required
          body (required — explain WHY, not just what)

        Valid types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert
        Scope is required (e.g., auth, api, mcp). Use kebab-case for multi-word scopes.